<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mark placement preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        background: #020617;
        color: #e5e7eb;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #94a3b8;
      }

      code {
        color: #86efac;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #1e293b;
        border-radius: 16px;
        background: #020617;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }

      figure {
        margin: 0;
        padding: 16px;
        border: 1px solid #1e293b;
        border-radius: 16px;
        background: #0f172a;
      }

      figure img {
        border: 0;
        border-radius: 8px;
      }

      figcaption {
        margin-top: 12px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>音符落点与前进</h1>
      <p>
        预览只读取同一份 <code>xOffset/yOffset/xAdvance/yAdvance</code>。修改排版位置后重新运行
        <code>node preview/draw.mjs</code>，本页与 <code>positions.json</code> 会一起更新。
      </p>
      <img src="./out.svg" alt="Hebrew, Burmese, fallback, and OpenSans A previews" />
      <div class="grid">
        <figure>
          <img src="./hebrew.svg" alt="Hebrew mark positioning" />
          <figcaption>הֲבֵל：40+901、15@512,0+0、29+967、13@600,0+0、32+1071；整段 2939。</figcaption>
        </figure>
        <figure>
          <img src="./myanmar.svg" alt="Burmese mark positioning" />
          <figcaption>ကု：1+1124、2@-5,0+0；整段 1124。</figcaption>
        </figure>
        <figure>
          <img src="./fallback.svg" alt="Unicode fallback mark positioning" />
          <figcaption>无 GPOS 时也输出同样的偏移加前进格式。</figcaption>
        </figure>
        <figure>
          <img src="./open-sans-a.svg" alt="OpenSans A control" />
          <figcaption>OpenSans A：前进 1296，路径从 M1120 0L938 465 起。</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
